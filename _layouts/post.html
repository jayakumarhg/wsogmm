---
layout: default
---

<article class="post">
  <h1 class="post-title">{{ page.title }}</h1>
  <div class="post-subtitle">
    <time datetime="{{ page.date | date_to_xmlschema }}" class="post-date">
      {{ page.date | date_to_string }}
    </time>
    -
    <span class="post-author">{{site.author.name}}</span>
  </div> 
  {{ content }}
</article>
